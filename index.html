<!DOCTYPE html>

<body>
<h1>时 痕</h1>
<div class="sub">TIME ECHO — 每一次重来，都留下一道痕</div>
<div id="stage">
  <canvas id="cv" width="896" height="512"></canvas>
  <div id="overlay">
    <h2>时痕实验</h2>
    <p id="ovText">
      时间管理局 · 实验体 No.217 记录<br><br>
      你不是一个人在解谜——<br>
      每一次按下 <b style="color:#ffd76a">R</b>，本条时间线都会凝固成一枚幽灵克隆体，<br>
      在下一次循环中重演你走过的一切。<br><br>
      踩住开关，顶住大门，然后……潇洒穿过。<br>

</div>
<div id="hud">
  <span>关卡 <b id="lvName">-</b></span>
  <span>克隆体 <b id="ghostCnt">0</b> / 8</span>
  <span>本条时间线 <b id="tickCnt">0</b> tick</span>
  <span>
    <span class="key">方向键 / WASD</span>移动
    <span class="key">R</span>凝固克隆
    <span class="key">Z</span>撤销
    <span class="key">X</span>清除全部克隆
    <span class="key">M</span>静音
  </span>
</div>
<div id="tip"></div>

<script>
/* =====================================================
   时痕 v1 —— 轨迹录制 / 幽灵重演 / 合作解谜
   核心机制：每轮尝试记录玩家输入序列；按 R 后该序列成为
   幽灵克隆体，在后续每轮从出生点确定性重演，与玩家协作
   踩压力板、开门。纯 Canvas 占位图形，素材可后续替换。
   ===================================================== */

const CELL = 64, COLS = 14, ROWS = 8, TICK = 110; // 逻辑帧 110ms/tick
const SPEED = 7; // 玩家/幽灵连续滑行速度（格/秒）
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');

/* ---------- 关卡配置（参考 Sokoban XSB 惯例：地图即文本，一格一字符） ----------
   map 符号表：# 墙   . 地板   ^ 尖刺   S 出生点   E 出口
               P 压力板/拉杆   D 条件门   G 定时闸门   > 单向地砖
   符号只负责“在哪里”，参数按阅读顺序（从上到下、从左到右）与下列数组一一对应：
     plates:  'A' 或 {g:'B', toggle:true}   每个 P 的分组 / 是否一次性拉杆
     doors:   ['A','B']                     每个 D 需要哪些组同时被压住
     gates:   {openFor, closedFor, phase}   每个 G 的开/关节拍（tick）与相位
     oneways: 'right' | 'down' | 'left' | 'up'   每个 > 的允许通行方向
     guards:  {path:[...]}                  哨兵巡逻路径（格坐标），独立于网格 */
/* 生成哨兵往返巡逻路径：两端点各出现两次，折返处自然停顿一格时间，无瞬移 */
function patrol(x1, x2, y){
  const p = [];
  for (let x=x1;x<=x2;x++) p.push([x,y]);
  for (let x=x2;x>=x1;x--) p.push([x,y]);
  return p;
}
const GUARD_SPEED = 3; // 哨兵每 3 tick 走一格（比玩家慢，可等它转身后跟在身后穿过）

const LEVELS = [
  {
    name: "1 · 热身",
    tip: "方向键移动，走到绿色出口。先熟悉一下你的两条腿。",
    map: [
      "############",
      "#S.........#",
      "#..........#",
      "#.........E#",
      "############"
    ],
  },
  {
    name: "2 · 幽灵开关",
    tip: "门只认重量。按 R 凝固本条时间线——下一轮，它会替你踩住开关。",
    map: [
      "#############",
      "#S....#.....#",
      "#.....#.....#",
      "#..P..D....E#",
      "#.....#.....#",
      "#############"
    ],
    plates: ['A'],
    doors:  [['A']]
  },
  {
    name: "3 · 双重保险",
    tip: "两块开关要同时压住。小心红色尖刺——幽灵免疫，但你不是。",
    map: [
      "##############",
      "#S....^..#..E#",
      "#........#...#",
      "#..P.....D...#",
      "#.....^..#...#",
      "#...P....#...#",
      "##############"
    ],
    plates: ['A','B'],
    doors:  [['A','B']]
  },
  {
    name: "4 · 拉杆接力",
    tip: "金色拉杆是一次性开关：踩下即永久开启，不必一直压住。规划好每一条时间线的任务再出发。",
    map: [
      "##############",
      "#S..#.....#E.#",
      "#...#..P..#..#",
      "#...D.....#..#",
      "#...#.....D..#",
      "#.P.#.....#..#",
      "##############"
    ],
    plates: [{g:'B',toggle:true},{g:'A',toggle:true}],
    doors:  [['A'],['B']]
  },
  {
    name: "5 · 哨兵走廊",
    tip: "红色哨兵在走廊折返巡逻（幽灵免疫）。下层可以绕行，但中段有尖刺——先躲进下层等它走过头顶，再贴着它背后冲过尖刺区上方。",
    map: [
      "##############",
      "#S..........E#",
      "#....^^^.....#",
      "##############"
    ],
    guards: [{path: patrol(3,9,1)}]
  },
  {
    name: "6 · 潮汐闸门",
    tip: "紫色闸门按节拍开合，两扇门轮流放行。跟上一半的节奏，别贪快。",
    map: [
      "##############",
      "#S...G...G..E#",
      "##############"
    ],
    gates: [
      {openFor:5, closedFor:5, phase:0},
      {openFor:5, closedFor:5, phase:5}
    ]
  },
  {
    name: "7 · 期末小考",
    tip: "期末小考全元素登场：幽灵走下层专用道——拉杆、单向道、压力板常驻；你走中层——卡闸门节拍进哨兵区，借上排空档躲巡逻，冲到右端顶开双条件门。地上的红色尖刺碰不得。",
    map: [
      "##############",
      "#S.......#..E#",
      "#.####.####D##",
      "#..^...#..^..#",
      "#......G.....#",
      "#.#########.##",
      "#.P..>>...P###",
      "##############"
    ],
    plates: [{g:'B',toggle:true},{g:'A'}],
    doors:  [['A','B']],
    gates:  [{openFor:4, closedFor:4, phase:0}],
    guards: [{path: patrol(8,12,4)}],
    oneways: ['right', 'right']
  },
  {
    name: "8 · 终极时间线",
    tip: "哨兵、闸门、双开关齐了。下层通道要闯哨兵区，上层捷径要卡闸门节拍——规划好每条时间线的任务。",
    map: [
      "##############",
      "#S.......G.DE#",
      "#..........###",
      "#.P........P.#",
      "#....^^^^....#",
      "##############"
    ],
    plates: ['A','B'],
    doors:  [['A','B']],
    gates: [{openFor:4, closedFor:4, phase:0}],
    guards: [{path: patrol(3,10,3)}]
  }
];

/* ---------- 音效（WebAudio 合成，零素材） ---------- */
let audioCtx = null, muted = false;
function beep(f, dur=0.12, type='square', vol=0.12, delay=0){
  if (muted) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const t = audioCtx.currentTime + delay;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(audioCtx.destination);
    o.start(t); o.stop(t + dur);
  } catch(e){}
}
const sfx = {
  bank:  ()=>{ beep(520,.08); beep(780,.1,'square',.1,.07); },
  death: ()=>{ beep(180,.16,'sawtooth',.14); beep(120,.22,'sawtooth',.12,.1); },
  clear: ()=>{ [523,659,784,1046].forEach((f,i)=>beep(f,.14,'triangle',.12,i*.09)); },
  win:   ()=>{ [523,659,784,1046,1318].forEach((f,i)=>beep(f,.2,'triangle',.12,i*.12)); },
  step:  ()=>beep(240,.03,'square',.03)
};

/* ---------- 工具 ---------- */
function scanGrid(L, ch){
  for (let y=0;y<L.map.length;y++){
    const x = L.map[y].indexOf(ch);
    if (x >= 0) return {x, y};
  }
  return null;
}
/* 解析关卡：扫描 map 网格收集地形与实体位置（阅读顺序），再按序配上参数 */
function parseLevel(L){
  const walls = new Set(), spikes = new Set();
  const found = { P:[], D:[], G:[], '>':[] };
  L.map.forEach((row,y)=>[...row].forEach((ch,x)=>{
    if (ch==='#') walls.add(x+','+y);
    else if (ch==='^') spikes.add(x+','+y);
    else if (found[ch]) found[ch].push({x,y});
  }));
  /* 网格符号数量与参数数量必须一致，不一致时告警并用默认值兜底 */
  const warn = (cells, params, label) => {
    if (cells.length !== (params||[]).length)
      console.warn(`[关卡 ${L.name}] ${label}：网格 ${cells.length} 处 vs 参数 ${(params||[]).length} 条，缺失处使用默认值`);
  };
  warn(found.P, L.plates, '压力板 P'); warn(found.D, L.doors, '门 D');
  warn(found.G, L.gates, '闸门 G');    warn(found['>'], L.oneways, '单向砖 >');
  return { ...L,
    walls, spikes,
    cols: L.map[0].length, rows: L.map.length,
    spawn: scanGrid(L,'S'), exit: scanGrid(L,'E'),
    plates: found.P.map((c,i)=>{
      const p = (L.plates||[])[i], o = typeof p==='string' ? {g:p} : (p||{});
      return { x:c.x, y:c.y, g:o.g||'A', toggle:!!o.toggle };
    }),
    doors: found.D.map((c,i)=>({ x:c.x, y:c.y, need:(L.doors||[])[i]||['A'] })),
    timedGates: found.G.map((c,i)=>({ x:c.x, y:c.y, openFor:4, closedFor:4, phase:0, ...(L.gates||[])[i] })),
    oneways: found['>'].map((c,i)=>({ x:c.x, y:c.y, dir:(L.oneways||[])[i]||'right' }))
  };
}

/* ---------- 全局状态 ---------- */
let G = null;
let stats = { attempts:1, banks:0, startAt:0 };
let mode = 'title'; // title | play | clear | win
let clearAt = 0;
const overlayEl = document.getElementById('overlay');
const tipEl = document.getElementById('tip');
let tipBase = '', tipTimer = 0;

function loadLevel(idx){
  const L = parseLevel(LEVELS[idx]);
  G = {
    L, idx,
    player: makeEntity(L.spawn),
    ghosts: [],            // {inputs:[{t,dir}], ptr, gx,gy,fx,fy, px,py, alive}
    inputs: [],
    stepQueue: [],         // 单击意图队列（最多缓存 2 步，格心提交时消费）
    tickN: 0, lastTickAt: performance.now(), deathAt: 0,
    tripped: new Set(),          // 已触发的拉杆（toggle）格，每轮重置后由幽灵重演再次触发
    doorsAnim: new Map(),
    ox: (COLS - L.cols) * CELL / 2,
    oy: (ROWS - L.rows) * CELL / 2
  };
  tipBase = '💡 ' + L.tip;
  tipEl.textContent = tipBase;
  document.getElementById('lvName').textContent = L.name;
}

function makeEntity(p){
  // px/py: 浮点连续位置（格单位，渲染用）；gx/gy: 已提交的逻辑格（判定用）
  return { gx:p.x, gy:p.y, fx:p.x, fy:p.y, px:p.x, py:p.y,
           moving:false, mdir:null, tx:p.x, ty:p.y, alive:true };
}

/* 回合重置：玩家与所有幽灵回到出生点，输入序列清空，幽灵从头重演 */
function resetAttempt(countAttempt){
  const L = G.L;
  G.player = makeEntity(L.spawn);
  G.ghosts.forEach(g => { g.ptr = 0; Object.assign(g, makeEntity(L.spawn), {inputs:g.inputs}); });
  G.inputs = [];
  G.stepQueue.length = 0;
  G.tripped = new Set();
  G.tickN = 0; G.lastTickAt = performance.now();
  keyStack.length = 0;
  if (countAttempt) stats.attempts++;
  updateHud();
}

function updateHud(){
  document.getElementById('ghostCnt').textContent = G.ghosts.length;
  document.getElementById('tickCnt').textContent = G.tickN;
}

function flashTip(msg){
  tipEl.textContent = '⚡ ' + msg;
  clearTimeout(tipTimer);
  tipTimer = setTimeout(()=>{ tipEl.textContent = tipBase; }, 1600);
}

/* ---------- 移动规则 ---------- */
function entities(){ return G.player.alive ? [G.player, ...G.ghosts] : [...G.ghosts]; }
function doorOpen(d){
  return d.need.every(g => G.L.plates.some(p => {
    if (p.g !== g) return false;
    // 拉杆（toggle）：踩下即永久触发；压力板：需持续压住
    if (p.toggle) return G.tripped.has(p.x+','+p.y) || entities().some(e => e.gx===p.x && e.gy===p.y);
    return entities().some(e => e.gx === p.x && e.gy === p.y);
  }));
}
/* 实体踏上拉杆格即触发（玩家落格 / 幽灵重演各调用一次） */
function tripToggles(e){
  const p = G.L.plates.find(q => q.toggle && q.x===e.gx && q.y===e.gy);
  if (p && !G.tripped.has(p.x+','+p.y)){ G.tripped.add(p.x+','+p.y); sfx.bank(); }
}
function doorAt(x,y){ return G.L.doors.find(d => d.x===x && d.y===y); }
function timedGateAt(x,y){ return (G.L.timedGates||[]).find(g=>g.x===x&&g.y===y); }
function gateOpen(tg){
  const cyc = tg.openFor + tg.closedFor;
  return ((G.tickN + tg.phase) % cyc) < tg.openFor;
}
function onewayAt(x,y){ return (G.L.oneways||[]).find(o=>o.x===x&&o.y===y); }
function guardPos(gd){
  return gd.path[Math.floor(G.tickN / GUARD_SPEED) % gd.path.length];
}
function mod(n,m){ return ((n % m) + m) % m; }
/* 哨兵渲染/判定用连续浮点位置：整段步长（GUARD_SPEED 个 tick）内匀速滑行，
   逻辑格在步长起点更新、画面在步长终点追上，全程无停顿无回弹 */
function guardRenderPos(gd){
  const len = gd.path.length;
  const idx = Math.floor(G.tickN / GUARD_SPEED);
  const cur = gd.path[mod(idx, len)];
  const prev = gd.path[mod(idx - 1, len)];
  const tf = Math.min((performance.now() - G.lastTickAt) / TICK, 1);
  const f = Math.min((G.tickN % GUARD_SPEED + tf) / GUARD_SPEED, 1);
  return [lerp(prev[0], cur[0], f), lerp(prev[1], cur[1], f)];
}
function canMove(x,y,dir){
  if (x<0 || y<0 || x>=G.L.cols || y>=G.L.rows) return false;
  if (G.L.walls.has(x+','+y)) return false;
  const d = doorAt(x,y);
  if (d && !doorOpen(d)) return false;
  const tg = timedGateAt(x,y);
  if (tg && !gateOpen(tg)) return false;
  const ow = onewayAt(x,y);
  if (ow && ow.dir !== dir) return false; // 箭头地砖：仅许顺向进入
  return true;
}
const DIRV = { up:[0,-1], down:[0,1], left:[-1,0], right:[1,0] };
function tryMove(e, dir, record){
  const d = DIRV[dir];
  const nx = e.gx + d[0], ny = e.gy + d[1];
  if (!canMove(nx,ny,dir)) return false;
  e.fx = e.gx; e.fy = e.gy; e.gx = nx; e.gy = ny;
  if (record){ G.inputs.push({t:G.tickN + 1, dir}); sfx.step(); }
  return true;
}

/* ---------- 逻辑 tick（确定性：玩家先动，幽灵重演同序输入） ---------- */
function tick(){
  G.tickN++;
  G.lastTickAt = performance.now();
  // 吸附：未发生移动的幽灵固定在当前格，防止插值回滑
  G.ghosts.forEach(g => { g.fx = g.gx; g.fy = g.gy; });
  for (const g of G.ghosts){
    // 重演：把时间戳 <= 当前 tick 的输入依序应用（输入可能因点击节奏多个挤在同一 tick）
    while (g.ptr < g.inputs.length && g.inputs[g.ptr].t <= G.tickN){
      tryMove(g, g.inputs[g.ptr].dir, false);
      tripToggles(g);
      g.ptr++;
    }
  }
  updateHud();
}

/* 死亡结算：尖刺与哨兵共用（幽灵免疫，仅玩家受判定） */
function killPlayer(){
  G.player.alive = false;
  G.player.moving = false;
  G.deathAt = performance.now();
  sfx.death();
  setTimeout(()=>{ if (mode==='play' && !G.player.alive) resetAttempt(false); }, 700);
}
function checkHazards(){
  if (!G.player.alive) return;
  if (G.L.spikes.has(G.player.gx+','+G.player.gy)) return killPlayer();
  // 哨兵：与画面位置一致的连续碰撞（中心距 < 0.6 格）；幽灵免疫
  for (const gd of (G.L.guards||[])){
    const gp = guardRenderPos(gd);
    const dx = gp[0] - G.player.px, dy = gp[1] - G.player.py;
    if (dx*dx + dy*dy < 0.6*0.6) return killPlayer();
  }
  const e = G.L.exit;
  if (G.player.gx===e.x && G.player.gy===e.y) onLevelClear();
}

function bank(){
  if (mode!=='play' || !G.player.alive || G.inputs.length===0) return;
  if (G.ghosts.length >= 8){ flashTip('克隆体已达上限（8 枚）'); return; }
  const g = makeEntity(G.L.spawn);
  g.inputs = [...G.inputs]; g.ptr = 0;
  G.ghosts.push(g);
  stats.banks++;
  sfx.bank();
  flashTip('时间线已凝固为克隆体 #' + G.ghosts.length);
  resetAttempt(false);
}

function fullReset(){
  if (mode!=='play') return;
  G.ghosts = []; stats.attempts++;
  resetAttempt(true);
  flashTip('所有克隆体已清除');
}

/* 撤销上一步（从输入序列弹出并回退玩家位置，不影响已有克隆体） */
function undo(){
  if (mode!=='play' || !G.player.alive || G.inputs.length===0) return;
  const inp = G.inputs.pop();
  const d = DIRV[inp.dir];
  const p = G.player;
  p.moving = false; p.mdir = null;
  p.gx -= d[0]; p.gy -= d[1];
  p.px = p.gx; p.py = p.gy; p.tx = p.gx; p.ty = p.gy;
  sfx.step();
}

function onLevelClear(){
  if (mode !== 'play') return;
  mode = 'clear'; clearAt = performance.now(); sfx.clear();
  setTimeout(nextLevel, 1100);
}
function nextLevel(){
  if (G.idx + 1 >= LEVELS.length){
    mode = 'win'; sfx.win();
    const secs = Math.max(1, Math.round((performance.now() - stats.startAt)/1000));
    document.getElementById('ovText').innerHTML =
      `实验完成 ✔<br><br>总时间线尝试 <b>${stats.attempts}</b> 次，凝固克隆体 <b>${stats.banks}</b> 枚，耗时 <b>${secs}</b> 秒。<br><br>时间管理局评语：<b>过去从未消失，它只是站在原地等你。</b>`;
    document.querySelector('#overlay .blink').textContent = '按 回车 重新开始实验';
    overlayEl.classList.remove('hidden');
  } else {
    loadLevel(G.idx + 1);
    mode = 'play';
  }
}

/* ---------- 输入 ---------- */
const keyStack = [];
const keyDir = {
  ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right',
  KeyW:'up', KeyS:'down', KeyA:'left', KeyD:'right'
};
addEventListener('keydown', e=>{
  if (mode==='title' || mode==='win'){
    if (e.code==='Enter' || e.code==='Space'){
      stats = { attempts:1, banks:0, startAt:performance.now() };
      loadLevel(0); mode='play';
      overlayEl.classList.add('hidden');
    }
    return;
  }
  if (keyDir[e.code]){
    e.preventDefault();
    const dir = keyDir[e.code];
    if (!keyStack.includes(dir)) keyStack.push(dir);
    // 单击意图入队（长按由 keyStack 驱动连续滑行）；滑动到格心时消费
    if (G && mode==='play' && G.player.alive && !e.repeat && G.stepQueue.length < 2){
      G.stepQueue.push(dir);
    }
  }
  else if (e.code==='KeyR') bank();
  else if (e.code==='KeyZ') undo();
  else if (e.code==='KeyX') fullReset();
  else if (e.code==='KeyM'){ muted = !muted; flashTip(muted?'已静音':'声音开启'); }
});
addEventListener('keyup', e=>{
  const dir = keyDir[e.code];
  if (dir){ const i = keyStack.indexOf(dir); if (i>=0) keyStack.splice(i,1); }
});
addEventListener('blur', ()=>keyStack.length=0);

/* ---------- 渲染 ---------- */
function lerp(a,b,t){ return a + (b-a)*t; }
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.roundRect(x,y,w,h,r); ctx.fill(); }

let last = performance.now(), globalT = 0;
const trails = new Map(); // 幽灵拖尾（键 = 幽灵对象）

/* 逻辑帧：setInterval 驱动（后台标签页不被 rAF 暂停拖死） */
setInterval(()=>{
  if (mode==='play') tick();
}, TICK);

/* 移动/碰撞推进：同样用 setInterval（16ms ≈ 60fps），rAF 只管渲染。
   这样即使标签页在后台被浏览器节流 rAF，移动也不会丢步或瞬移 */
setInterval(()=>{
  const now = performance.now();
  const dt = Math.min(now - last, 100); last = now; globalT += dt;
  if (mode==='play' && G){
    advancePlayer(dt);
    advanceGhosts(dt);
    checkHazards(); // 哨兵每帧连续判定（玩家静止时哨兵撞上来也会死）
  }
}, 16);

function frame(){
  draw();
  requestAnimationFrame(frame);
}

/* ---------- 连续滑行（按帧 dt 移动，格心提交逻辑状态） ---------- */
function advancePlayer(dt){
  const p = G.player;
  if (!p.alive) return;
  const step = SPEED * dt / 1000;
  if (!p.moving){
    // 取方向：按住的键优先，其次消费单击意图队列
    const held = keyStack[keyStack.length-1];
    let dir = null;
    if (held){ dir = held; if (G.stepQueue[0] === held) G.stepQueue.shift(); }
    else if (G.stepQueue.length) dir = G.stepQueue.shift();
    if (!dir) return;
    if (!canMove(p.gx+DIRV[dir][0], p.gy+DIRV[dir][1], dir)) return;
    p.mdir = dir;
    p.tx = p.gx + DIRV[dir][0]; p.ty = p.gy + DIRV[dir][1];
    p.moving = true;
  }
  // 朝目标格心匀速滑动
  if (p.px < p.tx) p.px = Math.min(p.px + step, p.tx);
  else if (p.px > p.tx) p.px = Math.max(p.px - step, p.tx);
  if (p.py < p.ty) p.py = Math.min(p.py + step, p.ty);
  else if (p.py > p.ty) p.py = Math.max(p.py - step, p.ty);
  // 到达格心：提交逻辑格并记录输入
  if (p.px === p.tx && p.py === p.ty){
    p.gx = p.tx; p.gy = p.ty;
    tripToggles(p);
    G.inputs.push({t: G.tickN + 1, dir: p.mdir});
    sfx.step();
    checkHazards();
    if (!p.alive || mode !== 'play') return;
    // 接续下一段滑行：按住的键优先，其次队列；都无则停在格心
    const held2 = keyStack[keyStack.length-1];
    let nd = null;
    if (held2){ nd = held2; if (G.stepQueue[0] === held2) G.stepQueue.shift(); }
    else if (G.stepQueue.length) nd = G.stepQueue.shift();
    if (nd && canMove(p.gx+DIRV[nd][0], p.gy+DIRV[nd][1], nd)){
      p.mdir = nd;
      p.tx = p.gx + DIRV[nd][0]; p.ty = p.gy + DIRV[nd][1];
    } else p.moving = false;
  }
}

function advanceGhosts(dt){
  const step = SPEED * dt / 1000;
  for (const g of G.ghosts){
    // 幽灵浮点位置向逻辑格滑行（逻辑格由 tick 重演提交）
    if (g.px < g.gx) g.px = Math.min(g.px + step, g.gx);
    else if (g.px > g.gx) g.px = Math.max(g.px - step, g.gx);
    if (g.py < g.gy) g.py = Math.min(g.py + step, g.gy);
    else if (g.py > g.gy) g.py = Math.max(g.py - step, g.gy);
  }
}

function draw(){
  ctx.clearRect(0,0,cv.width,cv.height);

  // 背景细网格
  ctx.strokeStyle = '#141a36'; ctx.lineWidth = 1;
  for (let i=0;i<=COLS;i++){ ctx.beginPath(); ctx.moveTo(i*CELL,0); ctx.lineTo(i*CELL,cv.height); ctx.stroke(); }
  for (let j=0;j<=ROWS;j++){ ctx.beginPath(); ctx.moveTo(0,j*CELL); ctx.lineTo(cv.width,j*CELL); ctx.stroke(); }

  if (!G) return;
  const { ox, oy } = G, L = G.L;

  // 地图格子
  for (let y=0;y<L.rows;y++) for (let x=0;x<L.cols;x++){
    const px = ox + x*CELL, py = oy + y*CELL, ch = L.map[y][x];
    if (ch==='#'){
      ctx.fillStyle = '#1e2749'; rr(px+2,py+2,CELL-4,CELL-4,8);
      ctx.fillStyle = '#2a3358'; rr(px+8,py+8,CELL-16,CELL-16,5);
    }
    else if (ch==='^'){
      ctx.fillStyle = '#ff5470';
      for (let k=0;k<3;k++){
        ctx.beginPath();
        ctx.moveTo(px+8+k*15, py+CELL-12);
        ctx.lineTo(px+15.5+k*15, py+16);
        ctx.lineTo(px+23+k*15, py+CELL-12);
        ctx.closePath(); ctx.fill();
      }
    }
    else if (ch==='E'){
      const pulse = 0.5 + 0.5*Math.sin(globalT/300);
      ctx.fillStyle = '#123f2c'; rr(px+6,py+6,CELL-12,CELL-12,10);
      ctx.strokeStyle = `rgba(110,240,160,${0.4+0.5*pulse})`; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.roundRect(px+6,py+6,CELL-12,CELL-12,10); ctx.stroke();
      ctx.fillStyle = '#7ee0a3';
      ctx.font = '28px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('🏁', px+CELL/2, py+CELL/2+2);
    }
    else {
      ctx.fillStyle = (x+y)%2 ? '#121730' : '#101528';
      rr(px+1,py+1,CELL-2,CELL-2,6);
    }
  }

  // 压力板（圆形）/ 拉杆（toggle，方形，踩下永久触发）
  for (const p of L.plates){
    const px = ox + p.x*CELL, py = oy + p.y*CELL;
    if (p.toggle){
      const on = G.tripped.has(p.x+','+p.y) || entities().some(e=>e.gx===p.x && e.gy===p.y);
      ctx.save();
      if (on){ ctx.shadowColor='#ffd76a'; ctx.shadowBlur=18; }
      rr(px+10, py+10, CELL-20, CELL-20, 8);
      ctx.fillStyle = on ? '#ffd76a' : '#3c4780'; ctx.fill();
      ctx.restore();
      ctx.fillStyle = on ? '#7a5b00' : '#223055';
      ctx.beginPath(); ctx.arc(px+CELL/2, py+CELL/2, 7, 0, 7); ctx.fill();
      continue;
    }
    const pressed = entities().some(e=>e.gx===p.x && e.gy===p.y);
    ctx.beginPath(); ctx.arc(px+CELL/2, py+CELL/2, 18, 0, 7);
    ctx.strokeStyle = pressed ? '#ffd76a' : '#3c4780'; ctx.lineWidth = 4; ctx.stroke();
    if (pressed){
      ctx.save(); ctx.shadowColor='#ffd76a'; ctx.shadowBlur=18;
      ctx.beginPath(); ctx.arc(px+CELL/2, py+CELL/2, 12, 0, 7);
      ctx.fillStyle='#ffd76a'; ctx.fill(); ctx.restore();
    } else {
      ctx.beginPath(); ctx.arc(px+CELL/2, py+CELL/2, 8, 0, 7);
      ctx.fillStyle='#314067'; ctx.fill();
    }
  }

  // 门（开合动画）
  for (const d of L.doors){
    const open = doorOpen(d) ? 1 : 0;
    let a = G.doorsAnim.get(d) ?? 0;
    a += (open - a) * 0.2;
    G.doorsAnim.set(d, a);
    const px = ox + d.x*CELL, py = oy + d.y*CELL;
    const h = (1-a) * (CELL-10);
    if (h > 2){
      ctx.fillStyle = '#ff9f43'; rr(px+8, py+5, CELL-16, h, 6);
      ctx.fillStyle = '#c96f1e'; rr(px+14, py+11, CELL-28, Math.max(h-12,0), 4);
    }
    ctx.strokeStyle = `rgba(255,159,67,${0.25+0.45*a})`; ctx.setLineDash([6,6]);
    ctx.strokeRect(px+8, py+8, CELL-16, CELL-16); ctx.setLineDash([]);
  }

  // 定时闸门（紫色，按节拍开合，底部有相位进度条）
  for (const tg of (L.timedGates||[])){
    const open = gateOpen(tg);
    const cyc = tg.openFor + tg.closedFor;
    const off = (G.tickN + tg.phase) % cyc;
    let a = G.doorsAnim.get(tg) ?? (open?1:0);
    a += ((open?1:0) - a) * 0.25;
    G.doorsAnim.set(tg, a);
    const px = ox + tg.x*CELL, py = oy + tg.y*CELL;
    const h = (1-a) * (CELL-10);
    if (h > 2){
      ctx.save(); ctx.shadowColor='#b48cff'; ctx.shadowBlur=12;
      ctx.fillStyle = '#8f6fe0'; rr(px+8, py+5, CELL-16, h, 6);
      ctx.restore();
      ctx.fillStyle = '#5d3fa8'; rr(px+14, py+11, CELL-28, Math.max(h-12,0), 4);
    }
    // 剩余相位指示条
    const remain = open ? (tg.openFor-off)/tg.openFor : (cyc-off)/tg.closedFor;
    ctx.fillStyle = open ? 'rgba(180,140,255,.9)' : 'rgba(93,63,168,.7)';
    rr(px+8, py+CELL-9, (CELL-16)*Math.max(remain,0), 4, 2);
  }

  // 单向箭头地砖
  for (const ow of (L.oneways||[])){
    const px = ox + ow.x*CELL, py = oy + ow.y*CELL;
    const ang = {right:0, down:Math.PI/2, left:Math.PI, up:-Math.PI/2}[ow.dir];
    ctx.save(); ctx.translate(px+CELL/2, py+CELL/2); ctx.rotate(ang);
    ctx.strokeStyle = '#4f6ab0'; ctx.lineWidth = 4; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(-7,-9); ctx.lineTo(6,0); ctx.lineTo(-7,9); ctx.stroke();
    ctx.restore();
  }

  // 哨兵（红色，缓慢巡逻，碰到即死；幽灵免疫）—— 渲染与判定同源，整步匀速滑行
  for (const gd of (L.guards||[])){
    const gp = guardRenderPos(gd);
    const px = ox + gp[0]*CELL, py = oy + gp[1]*CELL;
    ctx.save(); ctx.shadowColor='#ff5470'; ctx.shadowBlur=16;
    ctx.fillStyle = '#ff5470';
    rr(px+10, py+10, CELL-20, CELL-20, 10);
    ctx.restore();
    ctx.fillStyle = '#0b0e1a';
    ctx.beginPath(); ctx.arc(px+CELL/2, py+CELL/2-3, 5, 0, 7); ctx.fill();
    ctx.fillStyle = '#ffdde4';
    ctx.beginPath(); ctx.arc(px+CELL/2, py+CELL/2-3, 2, 0, 7); ctx.fill();
  }

  // 幽灵克隆体（拖尾 + 半透明，连续浮点位置）
  G.ghosts.forEach((g,i)=>{
    const hue = (i*70+190) % 360;
    const px = g.px*CELL, py = g.py*CELL;
    let tr = trails.get(g); if (!tr){ tr = []; trails.set(g, tr); }
    tr.push({x:px, y:py}); if (tr.length > 12) tr.shift();
    tr.forEach((pt,idx)=>{
      ctx.globalAlpha = (idx/tr.length) * 0.16;
      ctx.fillStyle = `hsl(${hue},80%,65%)`;
      ctx.beginPath(); ctx.arc(ox+pt.x+CELL/2, oy+pt.y+CELL/2, 10, 0, 7); ctx.fill();
    });
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = `hsl(${hue},80%,62%)`;
    rr(ox+px+10, oy+py+10, CELL-20, CELL-20, 10);
    drawEyes(ox+px, oy+py);
    ctx.globalAlpha = 1;
  });

  // 玩家（连续浮点位置）
  if (G.player.alive){
    const px = G.player.px*CELL, py = G.player.py*CELL;
    ctx.save(); ctx.shadowColor='#8fb0ff'; ctx.shadowBlur=20;
    ctx.fillStyle = '#f2f6ff';
    rr(ox+px+10, oy+py+10, CELL-20, CELL-20, 10);
    ctx.restore();
    drawEyes(ox+px, oy+py);
  } else {
    if (Math.floor(globalT/80)%2===0){
      const px = G.player.px*CELL, py = G.player.py*CELL;
      ctx.fillStyle = '#ff5470'; ctx.font='30px serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('💥', ox+px+CELL/2, oy+py+CELL/2);
    }
  }

  // 过关提示
  if (mode==='clear'){
    ctx.fillStyle = 'rgba(126,224,163,.10)'; ctx.fillRect(0,0,cv.width,cv.height);
    ctx.fillStyle = '#7ee0a3'; ctx.font='bold 34px "Microsoft YaHei"';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('✔ 时间线闭合', cv.width/2, cv.height/2 - 16);
    ctx.font='15px "Microsoft YaHei"'; ctx.fillStyle='#a8d8bd';
    ctx.fillText('本条时间线的你，正在出口等待下一次循环……', cv.width/2, cv.height/2 + 26);
  }
}

function drawEyes(px, py){
  ctx.fillStyle = '#0b0e1a';
  const cy = py+CELL/2-4;
  ctx.beginPath(); ctx.arc(px+CELL/2-8, cy, 4, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(px+CELL/2+8, cy, 4, 0, 7); ctx.fill();
}

requestAnimationFrame(frame);

/* 只读调试探针 + 隐藏跳关钩子（自动化测试 / 后续迭代用） */
window.__tc = () => ({
  mode,
  level: G?.L?.name,
  ghosts: G?.ghosts.length,
  tick: G?.tickN,
  player: G ? { x: G.player.gx, y: G.player.gy, px: G.player.px, py: G.player.py, moving: G.player.moving, alive: G.player.alive } : null,
  ghostPos: G?.ghosts.map(g => [g.gx, g.gy]),
  inputs: G?.inputs?.map(i => i.t + ':' + i.dir[0]),
  guards: G?.L?.guards?.map(gd => guardPos(gd)),
  gates: G?.L?.timedGates?.map(tg => gateOpen(tg)),
  doorsOpen: G?.L?.doors?.map(d => doorOpen(d))
});
window.__goto = (i) => { loadLevel(i); mode = 'play'; overlayEl.classList.add('hidden'); };
</script>
</body>
</html>
