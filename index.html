    max-width:92vw; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  #overlay {
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; gap:14px; padding:20px;
    background:#0b0e1ae8; backdrop-filter:blur(3px);
  }
  #overlay.hidden { display:none; }
  #overlay h2 { font-size:30px; letter-spacing:6px; color:#fff; text-shadow:0 0 20px #6ea8ff; }

  /* ---------- 动态海报主页 ---------- */

/* =====================================================
   时痕 v1 —— 轨迹录制 / 幽灵重演 / 合作解谜
   核心机制：每轮尝试记录玩家输入序列；按 R 后该序列成为
   幽灵克隆体，在后续每轮从出生点确定性重演，与玩家协作
   踩压力板、开门。纯 Canvas 占位图形，素材可后续替换。
   ===================================================== */

const CELL = 64, COLS = 14, ROWS = 8; // 格子尺寸（像素）
const PLAT_H = CELL / 2; // 悬浮平台碰撞厚度：半格（贴图实际约 18~31px，半格最接近）
/* 马里奥式平台跳跃物理：固定步长，保证幽灵重演确定性 */
const PSTEP = 16;    // 物理步长 ms（≈60fps）
const PSPEED = 4.06; // 水平速度 px/步（≈260px/s）
const PGRAV = 0.55;  // 重力 px/步²
const JUMPV = 12.7;  // 起跳初速 px/步（满跳高约 146px ≈ 2.3 格）
const COYOTE = 6;    // 土狼时间（步）：离地后仍可起跳的宽限
const EW = 44, EH = 44; // 实体碰撞盒尺寸
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');

/* ---------- 全屏视口：canvas 撑满窗口，虚拟舞台等比缩放居中 ---------- */
const VIEW_W = COLS * CELL, VIEW_H = ROWS * CELL;
let dpr = 1, viewScale = 1, viewOx = 0, viewOy = 0;
function fitCanvas(){
  dpr = window.devicePixelRatio || 1;
  const w = innerWidth, h = innerHeight;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  viewScale = Math.min(w / VIEW_W, h / VIEW_H);
  viewOx = (w - VIEW_W * viewScale) / 2;
  viewOy = (h - VIEW_H * viewScale) / 2;
}
addEventListener('resize', fitCanvas);
fitCanvas();



/* ---------- 关卡配置（惯例：地图即文本，一格一字符） ----------
   map 符号表：# 墙   . 地板   ^ 尖刺   S 出生点   E 出口
               P 压力板/拉杆   D 条件门   G 定时闸门   > 单向弹板（薄板，可从下方穿过、上方站立）
   符号只负责“在哪里”，参数按阅读顺序（从上到下、从左到右）与下列数组一一对应：
     plates:  'A' 或 {g:'B', toggle:true}   每个 P 的分组 / 是否一次性拉杆
     doors:   ['A','B']                     每个 D 需要哪些组同时被压住
     gates:   {openFor, closedFor, phase}   每个 G 的开/关节拍（物理步）与相位
     guards:  {path:[...]}                  哨兵巡逻路径（格坐标），独立于网格 */
/* 生成哨兵往返巡逻路径：两端点各出现两次，折返处自然停顿一格时间，无瞬移 */
function patrol(x1, x2, y){
  const p = [];
  for (let x=x1;x<=x2;x++) p.push([x,y]);
  for (let x=x2;x>=x1;x--) p.push([x,y]);
  return p;
}

/* ---------- 音效（WebAudio 合成，零素材） ---------- */
let audioCtx = null, muted = false;
function beep(f, dur=0.12, type='square', vol=0.12, delay=0){
  if (muted) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const t = audioCtx.currentTime + delay;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(audioCtx.destination);
    o.start(t); o.stop(t + dur);
  } catch(e){}
}
const sfx = {
  bank:  ()=>{ beep(520,.08); beep(780,.1,'square',.1,.07); },
  death: ()=>{ beep(180,.16,'sawtooth',.14); beep(120,.22,'sawtooth',.12,.1); },
  clear: ()=>{ [523,659,784,1046].forEach((f,i)=>beep(f,.14,'triangle',.12,i*.09)); },
  win:   ()=>{ [523,659,784,1046,1318].forEach((f,i)=>beep(f,.2,'triangle',.12,i*.12)); },
  step:  ()=>beep(240,.03,'square',.03)
};

/* ---------- 工具 ---------- */
function scanGrid(L, ch){
  for (let y=0;y<L.map.length;y++){
    const x = L.map[y].indexOf(ch);
    if (x >= 0) return {x, y};
  }
  return null;
}
/* 解析关卡：扫描 map 网格收集地形与实体位置（阅读顺序），再按序配上参数 */
function parseLevel(L){
  const walls = new Set(), spikes = new Set();
  const found = { P:[], D:[], G:[], '>':[] };
  L.map.forEach((row,y)=>[...row].forEach((ch,x)=>{
    if (ch==='#') walls.add(x+','+y);
    else if (ch==='^') spikes.add(x+','+y);
    else if (found[ch]) found[ch].push({x,y});
  }));
  /* 网格符号数量与参数数量必须一致，不一致时告警并用默认值兜底 */
  const warn = (cells, params, label) => {
    if (cells.length !== (params||[]).length)
      console.warn(`[关卡 ${L.name}] ${label}：网格 ${cells.length} 处 vs 参数 ${(params||[]).length} 条，缺失处使用默认值`);
  };
  warn(found.P, L.plates, '压力板 P'); warn(found.D, L.doors, '门 D');
  warn(found.G, L.gates, '闸门 G');    warn(found['>'], L.oneways, '单向砖 >');
  /* 水平连续墙段：每行内连续的 '#' 合并为一段，用于整条贴台阶石板素材 */
  const segs = [];
  L.map.forEach((row,y)=>{
    for (let x=0;x<row.length;x++){
      if (row[x]==='#'){
        const x0=x;
        while (x<row.length && row[x]==='#') x++;
        segs.push({x0, x1:x-1, y});
      }
    }
  });
  /* 悬浮平台（贴台阶素材的横条）：碰撞只占格子顶部半格，其余高度可以穿过 */
  const ledges = new Set();
  for (const s of segs){
    if (s.y === 0 || s.y === L.map.length - 1) continue;      // 顶墙、底地面保持整格
    if (s.x0 === 0 || s.x1 === L.map[0].length - 1) continue; // 贴左右边界的墙保持整格
    if (s.x0 === s.x1) continue;                              // 单格竖墙保持整格
    for (let x=s.x0; x<=s.x1; x++) ledges.add(x + ',' + s.y);
  }
  return { ...L,
    walls, spikes, segs, ledges,
    cols: L.map[0].length, rows: L.map.length,
    spawn: scanGrid(L,'S'), exit: scanGrid(L,'E'),
    plates: found.P.map((c,i)=>{
      const p = (L.plates||[])[i], o = typeof p==='string' ? {g:p} : (p||{});
      return { x:c.x, y:c.y, g:o.g||'A', toggle:!!o.toggle };
    }),
    doors: found.D.map((c,i)=>({ x:c.x, y:c.y, need:(L.doors||[])[i]||['A'] })),
    timedGates: found.G.map((c,i)=>({ x:c.x, y:c.y, openFor:4, closedFor:4, phase:0, ...(L.gates||[])[i] })),
    oneways: found['>'].map((c,i)=>({ x:c.x, y:c.y, dir:(L.oneways||[])[i]||'right' }))
  };
}

/* ---------- 全局状态 ---------- */
let G = null;
let stats = { attempts:1, banks:0, startAt:0 };
let mode = 'title'; // title | play | clear | win
let clearAt = 0;
const overlayEl = document.getElementById('overlay');
const tipEl = document.getElementById('tip');
let tipBase = '', tipTimer = 0;

function loadLevel(idx){
  const L = parseLevel(LEVELS[idx]);
  G = {
    L, idx,
    player: makeEntity(L.spawn),
    ghosts: [],            // {inputs:[{l,r,j}], ptr, x,y,...}
    inputs: [],            // 玩家本条时间线的按键帧序列（每物理步一帧）
    pstep: 0, lastPstepAt: performance.now(),
    deathAt: 0,
    tripped: new Set(),    // 已触发的拉杆（toggle），幽灵重演会再次触发
    doorsAnim: new Map(),
    ox: (COLS - L.cols) * CELL / 2,
    oy: (ROWS - L.rows) * CELL / 2
  };
  tipBase = '💡 ' + (IS_TOUCH
    ? L.tip.replace('方向键移动，空格/↑跳跃', '左右按钮移动，「跳」按钮跳跃').replace(/按 R 凝固/g, '点「克隆」凝固')
    : L.tip);
  tipEl.textContent = tipBase;
  document.getElementById('lvName').textContent = L.name;
}

function makeEntity(p){
  // 像素实体：站在出生格底部，x/y 为左上角
  return { x: p.x*CELL + (CELL-EW)/2, y: p.y*CELL + (CELL-EH),
           vx:0, vy:0, grounded:false, face:'right', jHeld:false,
           coyote:0, alive:true, isPlayer:false };
}

/* 回合重置：玩家与所有幽灵回到出生点，输入序列清空，幽灵从头重演 */
function resetAttempt(countAttempt){
  const L = G.L;
  G.player = makeEntity(L.spawn);
  G.ghosts.forEach(g => { g.ptr = 0; Object.assign(g, makeEntity(L.spawn), {inputs:g.inputs}); });
  G.inputs = [];
  G.tripped = new Set();
  G.pstep = 0; G.lastPstepAt = performance.now();
  held.clear();
  if (countAttempt) stats.attempts++;
  updateHud();
}

function updateHud(){
  document.getElementById('ghostCnt').textContent = G.ghosts.length;
  document.getElementById('tickCnt').textContent = G.pstep;
}

function flashTip(msg){
  tipEl.textContent = '⚡ ' + msg;
  clearTimeout(tipTimer);
  tipTimer = setTimeout(()=>{ tipEl.textContent = tipBase; }, 1600);
}

/* ---------- 物理与判定 ---------- */
function entities(){ return G.player.alive ? [G.player, ...G.ghosts] : [...G.ghosts]; }
/* AABB 与格子重叠判定（内缩 6px，贴边不算压住） */
function touches(e, cx, cy){
  return e.x + 6 < (cx+1)*CELL && e.x + EW - 6 > cx*CELL &&
         e.y + 6 < (cy+1)*CELL && e.y + EH - 6 > cy*CELL;
}
function rectHit(ax,ay,aw,ah, bx,by,bw,bh){
  return ax < bx+bw && ax+aw > bx && ay < by+bh && ay+ah > by;
}
/* 开关压住判定：实体中心点落在开关格内才算踩上（与发光位置对齐，避免隔格发光） */
function onPlate(e, cx, cy){
  const mx = e.x + EW/2, my = e.y + EH/2;
  return mx >= cx*CELL && mx < (cx+1)*CELL && my >= cy*CELL && my < (cy+1)*CELL;
}
function doorOpen(d){
  return d.need.every(g => G.L.plates.some(p => {
    if (p.g !== g) return false;
    // 拉杆（toggle）：踩下即永久触发；压力板：需持续压住
    const on = entities().some(e => onPlate(e, p.x, p.y));
    return p.toggle ? (G.tripped.has(p.x+','+p.y) || on) : on;
  }));
}
/* 实体踏上拉杆即触发（每物理步检查，Set 去重） */
function tripToggles(e){
  for (const p of G.L.plates){
    if (!p.toggle) continue;
    if (onPlate(e, p.x, p.y) && !G.tripped.has(p.x+','+p.y)){
      G.tripped.add(p.x+','+p.y); sfx.bank();
    }
  }
}
function doorAt(x,y){ return G.L.doors.find(d => d.x===x && d.y===y); }
function timedGateAt(x,y){ return (G.L.timedGates||[]).find(g=>g.x===x&&g.y===y); }
function gateOpen(tg){
  const cyc = tg.openFor + tg.closedFor;
  return ((G.pstep + tg.phase) % cyc) < tg.openFor;
}
function onewayAt(x,y){ return (G.L.oneways||[]).find(o=>o.x===x&&o.y===y); }
function mod(n,m){ return ((n % m) + m) % m; }
function guardPos(gd){
  return gd.path[Math.floor(G.pstep / GUARD_SPEED) % gd.path.length];
}
/* 哨兵渲染/判定用连续位置：整段步长（GUARD_SPEED 个物理步）内匀速滑行，无停顿无回弹 */
function guardRenderPos(gd){
  const len = gd.path.length;
  const idx = Math.floor(G.pstep / GUARD_SPEED);
  const cur = gd.path[mod(idx, len)];
  const prev = gd.path[mod(idx - 1, len)];
  const tf = Math.min((performance.now() - G.lastPstepAt) / PSTEP, 1);
  const f = Math.min((G.pstep % GUARD_SPEED + tf) / GUARD_SPEED, 1);
  return [lerp(prev[0], cur[0], f), lerp(prev[1], cur[1], f)];
}
/* 悬浮平台薄板：只占格子顶部半格，半格以下可以自由穿过 */
function ledgeAt(cx, cy){ return !!G.L.ledges && G.L.ledges.has(cx+','+cy); }
function bandHit(e, cx, cy){
  if (!ledgeAt(cx, cy)) return solidAt(cx, cy);
  return e.y < cy*CELL + PLAT_H && e.y + EH > cy*CELL;
}
/* 固体判定：墙、关闭的门与闸门；上下边界开放（可跳出屏顶 / 坠出屏底） */
function solidAt(cx, cy){
  if (cx < 0 || cx >= G.L.cols) return true;
  if (cy < 0 || cy >= G.L.rows) return false;
  if (ledgeAt(cx, cy)) return false; // 平台薄板由 collideAxis 按半格单独处理
  if (G.L.walls.has(cx+','+cy)) return true;
  const d = doorAt(cx,cy); if (d && !doorOpen(d)) return true;
  const tg = timedGateAt(cx,cy); if (tg && !gateOpen(tg)) return true;
  return false;
}

/* 单轴碰撞：移动后按覆盖到的格子扫描并贴边（先水平后垂直各调一次） */
function collideAxis(e, dx, dy){
  if (dx){
    e.x += dx;
    const y0 = Math.floor(e.y / CELL), y1 = Math.floor((e.y + EH - 1) / CELL);
    if (dx > 0){
      const cx = Math.floor((e.x + EW - 1) / CELL);
      for (let cy=y0; cy<=y1; cy++)
        if (bandHit(e,cx,cy)){ e.x = cx*CELL - EW; e.vx = 0; break; }
    } else {
      const cx = Math.floor(e.x / CELL);
      for (let cy=y0; cy<=y1; cy++)
        if (bandHit(e,cx,cy)){ e.x = (cx+1)*CELL; e.vx = 0; break; }
    }
  }
  if (dy){
    const prevBottom = e.y + EH;
    e.y += dy;
    const x0 = Math.floor((e.x + 2) / CELL), x1 = Math.floor((e.x + EW - 3) / CELL);
    if (dy > 0){
      const cy = Math.floor((e.y + EH - 1) / CELL);
      for (let cx=x0; cx<=x1; cx++){
        if (ledgeAt(cx,cy)){
          // 平台薄板：只承接从上方落下的实体，站立面与贴图顶部对齐
          if (prevBottom <= cy*CELL + 2){
            e.y = cy*CELL - EH; e.vy = 0; e.grounded = true; break;
          }
          continue;
        }
        const ow = onewayAt(cx, cy);
        // 单向弹板：仅下落且上一步底边在板上方时承接（可从下方穿过）
        if (solidAt(cx,cy) || (ow && prevBottom <= cy*CELL + 2)){
          e.y = cy*CELL - EH; e.vy = 0; e.grounded = true; break;
        }
      }
    } else {
      const cy = Math.floor(e.y / CELL);
      for (let cx=x0; cx<=x1; cx++){
        if (ledgeAt(cx,cy)){
          // 平台薄板底面：头顶到半格处即被挡住，给起跳留出半格余量
          if (e.y < cy*CELL + PLAT_H){ e.y = cy*CELL + PLAT_H; e.vy = 0; break; }
          continue;
        }
        if (solidAt(cx,cy)){ e.y = (cy+1)*CELL; e.vy = 0; break; }
      }
    }
  }
}

/* 一个物理步：确定性 —— 相同的按键帧序列必得到相同的轨迹（幽灵重演的基础） */
function physStep(e, f){
  const ax = (f.r?1:0) - (f.l?1:0);
  if (ax){ e.vx = ax * PSPEED; e.face = ax > 0 ? 'right' : 'left'; }
  else e.vx = 0;
  // 起跳：按键新按下 + 在地面或土狼时间内
  if (f.j && !e.jHeld && (e.grounded || e.coyote > 0)){
    e.vy = -JUMPV;
    e.grounded = false; e.coyote = 0;
    if (e.isPlayer) sfx.step();
  }
  e.jHeld = f.j;
  if (!f.j && e.vy < -4) e.vy *= 0.55; // 松手截断（短跳）
  e.coyote = e.grounded ? COYOTE : Math.max(0, e.coyote - 1);
  e.vy = Math.min(e.vy + PGRAV, 14);
  e.grounded = false;
  collideAxis(e, e.vx, 0);
  collideAxis(e, 0, e.vy);
}

/* 死亡结算（幽灵免疫，仅玩家受判定） */
function killPlayer(){
  G.player.alive = false;
  G.deathAt = performance.now();
  sfx.death();
  setTimeout(()=>{ if (mode==='play' && !G.player.alive) resetAttempt(false); }, 700);
}
function checkHazards(){
  const p = G.player;
  if (!p.alive) return;
  // 尖刺：格子下部（判定区比视觉三角更矮，顶部细尖不计，提升跳跃宽容度）
  for (const key of G.L.spikes){
    const [sx, sy] = key.split(',').map(Number);
    if (rectHit(p.x, p.y, EW, EH, sx*CELL+4, sy*CELL+24, CELL-8, CELL-24)) return killPlayer();
  }
  // 哨兵：像素中心距连续判定
  for (const gd of (G.L.guards||[])){
    const gp = guardRenderPos(gd);
    const dx = gp[0]*CELL + CELL/2 - (p.x + EW/2);
    const dy = gp[1]*CELL + CELL/2 - (p.y + EH/2);
    if (dx*dx + dy*dy < (0.55*CELL)*(0.55*CELL)) return killPlayer();
  }
  const e = G.L.exit;
  if (touches(p, e.x, e.y)) return onLevelClear();
  if (p.y > VIEW_H + 40) return killPlayer(); // 坠出屏幕
}

function bank(){
  if (mode!=='play' || !G.player.alive || G.inputs.length===0) return;
  if (G.ghosts.length >= 8){ flashTip('克隆体已达上限（8 枚）'); return; }
  const g = makeEntity(G.L.spawn);
  g.inputs = [...G.inputs]; g.ptr = 0;
  G.ghosts.push(g);
  stats.banks++;
  sfx.bank();
  flashTip('时间线已凝固为克隆体 #' + G.ghosts.length);
  resetAttempt(false);
}

function fullReset(){
  if (mode!=='play') return;
  G.ghosts = []; stats.attempts++;
  resetAttempt(true);
  flashTip('所有克隆体已清除');
}

function onLevelClear(){
  if (mode !== 'play') return;
  mode = 'clear'; clearAt = performance.now(); sfx.clear();
  setTimeout(nextLevel, 1100);
}
function nextLevel(){
  if (G.idx + 1 >= LEVELS.length){
    mode = 'win'; sfx.win();
    const secs = Math.max(1, Math.round((performance.now() - stats.startAt)/1000));
    document.getElementById('ovText').innerHTML =
      `实验完成 ✔<br><br>总时间线尝试 <b>${stats.attempts}</b> 次，凝固克隆体 <b>${stats.banks}</b> 枚，耗时 <b>${secs}</b> 秒。<br><br>时间管理局评语：<b>过去从未消失，它只是站在原地等你。</b>`;
    document.querySelector('#overlay .blink').textContent = (IS_TOUCH ? '点击屏幕' : '按 回车') + ' 重新开始实验';
    overlayEl.classList.remove('hidden');
  } else {
    loadLevel(G.idx + 1);
    mode = 'play';
  }
}

/* ---------- 输入 ---------- */
const held = new Set(); // 当前按住的动作（left/right/jump）
const keyAct = {
  ArrowLeft:'left',  KeyA:'left',
  ArrowRight:'right', KeyD:'right',
  ArrowUp:'jump',    KeyW:'jump', Space:'jump'
};
addEventListener('keydown', e=>{
  if (mode==='title' || mode==='win'){
    if (e.code==='Enter' || e.code==='Space'){
      stats = { attempts:1, banks:0, startAt:performance.now() };
      loadLevel(0); mode='play';
      overlayEl.classList.remove('title-mode');
      overlayEl.classList.add('hidden');
    }
    return;
  }
  if (keyAct[e.code]){
    e.preventDefault();
    held.add(keyAct[e.code]);
  }
  else if (e.code==='KeyR') bank();
  else if (e.code==='KeyX') fullReset();
  else if (e.code==='KeyM'){ muted = !muted; flashTip(muted?'已静音':'声音开启'); }
});
addEventListener('keyup', e=>{ if (keyAct[e.code]) held.delete(keyAct[e.code]); });
addEventListener('blur', ()=>held.clear());

/* ---------- 移动端触屏支持 ---------- */
/* 触屏判定：粗指针设备或支持触摸即启用虚拟按键（与键盘共用 held 集合，幽灵重演逻辑不变） */
const IS_TOUCH = matchMedia('(pointer: coarse)').matches ||
                 (navigator.maxTouchPoints > 0 && matchMedia('(hover: none)').matches);
if (IS_TOUCH){
  document.body.classList.add('touch');
  const home = document.querySelector('.homePrompt');
  if (home) home.textContent = '—— 点击屏幕 自动横屏并开始实验 ——';
  // 虚拟按键：按住 = held.add，松开/滑出 = held.delete（pointerleave 防手指滑出按钮卡键）
  const bindBtn = (id, act) => {
    const el = document.getElementById(id);
    const down = e => { e.preventDefault(); held.add(act); };
    const up   = e => { e.preventDefault(); held.delete(act); };
    el.addEventListener('pointerdown', down);
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
    el.addEventListener('pointerleave', up);
    el.addEventListener('contextmenu', e => e.preventDefault());
  };
  bindBtn('tLeft', 'left');
  bindBtn('tRight', 'right');
  bindBtn('tJump', 'jump');
  document.getElementById('tClone').addEventListener('pointerdown', e => { e.preventDefault(); bank(); });
  document.getElementById('tReset').addEventListener('pointerdown', e => { e.preventDefault(); fullReset(); });
  document.getElementById('tMute').addEventListener('pointerdown', e => {
    e.preventDefault(); muted = !muted; flashTip(muted ? '已静音' : '声音开启');
  });
  document.getElementById('touchUI').addEventListener('contextmenu', e => e.preventDefault());
  /* 进入页面后首次触摸即全屏并锁定横屏（横屏锁定必须由用户手势触发，首次触摸是最早时机） */
  const lockLandscape = () => {
    removeEventListener('pointerdown', lockLandscape, true);
    const de = document.documentElement;
    const p = de.requestFullscreen ? de.requestFullscreen().catch(()=>{}) : Promise.resolve();
    p.then(()=>{ try{ screen.orientation.lock('landscape').catch(()=>{}); }catch(err){} });
  };
  addEventListener('pointerdown', lockLandscape, true);
}
/* 主页 / 通关页：点击（触屏或鼠标）任意处开始，等效按回车 */
overlayEl.addEventListener('pointerdown', e => {
  if (mode !== 'title' && mode !== 'win') return;
  e.preventDefault();
  /* 手机：全屏并尽量锁定横屏（iOS 不支持锁定时由竖屏提示遮罩兜底） */
  if (IS_TOUCH){
    const de = document.documentElement;
    const p = de.requestFullscreen ? de.requestFullscreen().catch(()=>{}) : Promise.resolve();
    p.then(()=>{ try{ screen.orientation.lock('landscape').catch(()=>{}); }catch(err){} });
  }
  stats = { attempts:1, banks:0, startAt:performance.now() };
  loadLevel(0); mode = 'play';
  overlayEl.classList.remove('title-mode');
  overlayEl.classList.add('hidden');
});

/* ---------- 渲染 ---------- */
function lerp(a,b,t){ return a + (b-a)*t; }
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.roundRect(x,y,w,h,r); ctx.fill(); }

let last = performance.now(), globalT = 0;
const trails = new Map(); // 幽灵拖尾（键 = 幽灵对象）

/* 物理主循环：固定步长推进（后台标签页不被 rAF 暂停拖死）。
   玩家记录本步按键帧并走一个物理步；幽灵按记录的帧序列逐帧重演 */
const IDLE_FRAME = { l:false, r:false, j:false };
setInterval(()=>{
  if (mode!=='play' || !G) return;
  G.lastPstepAt = performance.now();
  G.pstep++;
  if (G.player.alive){
    const frame = { l:held.has('left'), r:held.has('right'), j:held.has('jump') };
    G.inputs.push(frame);
    physStep(G.player, frame);
    tripToggles(G.player);
  }
  for (const g of G.ghosts){
    const f = g.ptr < g.inputs.length ? g.inputs[g.ptr++] : IDLE_FRAME;
    physStep(g, f);
    tripToggles(g);
  }
  checkHazards();
  updateHud();
}, PSTEP);

function frame(){
  const now = performance.now();
  globalT += Math.min(now - last, 100); last = now; // 动画时钟（rAF 驱动）
  draw();
  requestAnimationFrame(frame);
}

/* ---------- 标题页：拆解海报元素，用代码重建动态场景 ---------- */
const T_STARS = Array.from({length:110}, () => ({
  x: Math.random()*896, y: Math.random()*512,
  r: .5 + Math.random()*1.4, p: Math.random()*6.28, s: .5 + Math.random()*1.5
}));

function tGlow(x, y, r, color){
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, color); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(x-r, y-r, r*2, r*2);
}
function tBrick(x, y, w = 46, h = 42){ // 主页砖块：比游戏墙亮一档，带顶部高光
  ctx.fillStyle = '#26305c'; rr(x, y, w, h, 9);
  ctx.fillStyle = '#323d72'; rr(x+5, y+5, w-10, h-14, 6);
  ctx.fillStyle = 'rgba(160,180,255,.16)'; rr(x+8, y+6, w-16, 5, 3);
}
const T_CUBE_STYLE = {
  player: ['#f2f6ff', '#8fb0ff', '#0b0e1a'],
  ghost:  ['#9fefff', '#7ee0ff', '#0b0e1a'],
  guard:  ['#ff5470', '#ff5470', '#3a0a14']
};
function tCube(x, y, name, s = 44){
  const [fill, glow, eye] = T_CUBE_STYLE[name];
  ctx.save(); ctx.shadowColor = glow; ctx.shadowBlur = 18;
  ctx.fillStyle = fill; rr(x-s/2, y-s/2, s, s, 11); ctx.restore();
  ctx.fillStyle = eye;
  ctx.beginPath(); ctx.arc(x-s*0.18, y-4, 4.5, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(x+s*0.18, y-4, 4.5, 0, 7); ctx.fill();
}
function tSpike(x, y){ // 红色尖刺（海报左上角的三角组）
  ctx.fillStyle = '#ff5470';
  for (let k=0;k<3;k++){
    ctx.beginPath();
    ctx.moveTo(x+k*13, y); ctx.lineTo(x+6.5+k*13, y-16); ctx.lineTo(x+13+k*13, y);
    ctx.closePath(); ctx.fill();
  }
}
/* ---------- 纯代码星空背景：渐变 + 星云光斑 + 碎星（主页与游戏共用） ---------- */
const BG_STARS = [];
{ // 固定伪随机序列生成碎星，位置稳定不跳动
  let s = 42;
  const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 90; i++)
    BG_STARS.push({ x: rnd()*VIEW_W, y: rnd()*VIEW_H, r: .8+rnd()*1.6, p: rnd()*6.28, sp: .5+rnd()*1.5 });
}
function drawSky(t, dim){
  // 纵向深空渐变（dim=游戏内，更暗以保证棋盘可读）
  const sky = ctx.createLinearGradient(0, 0, 0, VIEW_H);
  sky.addColorStop(0, dim ? '#131735' : '#1a1145');
  sky.addColorStop(.5, dim ? '#10132b' : '#141040');
  sky.addColorStop(1, dim ? '#0c0f22' : '#0c1024');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  // 星云光斑（缓慢呼吸）
  const neb = (x, y, r, rgb, k) => {
    const a = (dim ? .10 : .20) * (.7 + .3*Math.sin(t/2400*k));
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(${rgb},${a.toFixed(3)})`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(x-r, y-r, r*2, r*2);
  };
  neb(VIEW_W*.24, VIEW_H*.30, 300, '96,78,205', 1);
  neb(VIEW_W*.78, VIEW_H*.62, 340, '46,110,190', 1.6);
  if (!dim) neb(VIEW_W*.55, VIEW_H*.16, 220, '190,80,160', 2.1);
  // 碎星闪烁
  for (const st of BG_STARS){
    const tw = .25 + .55*(0.5 + 0.5*Math.sin(t/900*st.sp + st.p));
    ctx.globalAlpha = tw * (dim ? .45 : .9);
    ctx.fillStyle = '#cfd8ff';
    ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* ---------- 主页/地面台阶素材：加载后抠掉黑底与顶部水印、裁剪出石板主体 ---------- */
let stepCanvas = null;   // 悬浮平台/阶梯用（短石板）
let groundCanvas = null; // 底部长地面备用（台阶3）
let platCanvas = null;   // 底部长地面用（底部平台素材）
function procStepImg(img, done){
  try {
    const w = img.naturalWidth, h = img.naturalHeight;
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const cc = c.getContext('2d');
    cc.drawImage(img, 0, 0);
    const d = cc.getImageData(0, 0, w, h), px = d.data;
    let x0=w, y0=h, x1=0, y1=0;
    for (let i=0;i<px.length;i+=4){
      const k = i>>2, x = k%w, y = (k/w)|0;
      const lum = Math.max(px[i], px[i+1], px[i+2]);
      if (y < 110 || lum < 30) px[i+3] = 0;                 // 顶部水印区与纯黑底 → 全透明
      else if (lum < 75) px[i+3] = ((lum-30)/45*255)|0;     // 边缘渐变软化
      if (px[i+3] > 40){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }
    }
    cc.putImageData(d, 0, 0);
    const cw = x1-x0+1, ch = y1-y0+1;
    const c2 = document.createElement('canvas');
    c2.width = cw; c2.height = ch;
    c2.getContext('2d').drawImage(c, x0, y0, cw, ch, 0, 0, cw, ch);
    done(c2);
  } catch(e) { /* file:// 下跨域受限时保持 null，回退手绘砖 */ }
}
(function(){
  const i1 = new Image(); i1.onload = () => procStepImg(i1, c => stepCanvas = c);   i1.src = '素材/台阶.png';
  const i2 = new Image(); i2.onload = () => procStepImg(i2, c => groundCanvas = c); i2.src = '素材/台阶3.png';
  const i3 = new Image(); i3.onload = () => procStepImg(i3, c => platCanvas = c);   i3.src = '素材/底部平台.png';
})();

function titleScene(t){
  drawSky(t, false);
  // 前景闪烁星（叠加在素材上增加动感）
  for (const s of T_STARS){
    ctx.globalAlpha = .15 + .4*(0.5 + 0.5*Math.sin(t/1000*s.s + s.p));
    ctx.fillStyle = '#cfd8ff';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // ===== 马里奥式平台世界（海报同款深蓝砖块，静态结实） =====
  const PLATS = [
    { x: 40,  y: 300, n: 5 },   // 左平台（带尖刺）
    { x: 300, y: 400, n: 4 },   // 中低平台（金色压力板）
    { x: 560, y: 310, n: 6 },   // 右平台（哨兵巡逻 + 传送门）
  ];
  PLATS.forEach(p => {
    if (stepCanvas) ctx.drawImage(stepCanvas, p.x-10, p.y, p.n*50+20, 40); // 台阶素材（两端各外扩10px）
    else for (let k=0;k<p.n;k++) tBrick(p.x + k*50, p.y);                  // 素材未就绪时回退手绘砖
  });
  // 左平台：红色尖刺
  tSpike(58, PLATS[0].y - 1);

  // 装饰：蓝色箭头砖（左中，海报同款单向砖）
  ctx.fillStyle = '#151a38'; rr(170, 150, 64, 64, 12);
  ctx.fillStyle = '#3d8bff';
  ctx.beginPath(); ctx.moveTo(192,166); ctx.lineTo(218,182); ctx.lineTo(192,198); ctx.closePath(); ctx.fill();
  // 黄色圆环方块（右上，海报同款机关砖）
  const ringY = 142 + Math.sin(t/1200)*4;
  ctx.save(); ctx.shadowColor='#ffcf4d'; ctx.shadowBlur=16;
  ctx.fillStyle = '#ffcf4d'; rr(806, ringY, 56, 56, 14); ctx.restore();
  ctx.strokeStyle = '#0b0e1a'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.arc(834, ringY+28, 10, 0, 7); ctx.stroke();

  // 薄荷绿幽灵群（左上漂浮，海报角落同款）
  for (let i=0;i<3;i++){
    const gy = 100 + Math.sin(t/1000 + i*1.3)*6 + i*36;
    ctx.globalAlpha = .75;
    ctx.fillStyle = '#7fe8d2'; rr(44 + i*40, gy, 36, 36, 10);
    ctx.fillStyle = '#0b2a24';
    ctx.beginPath(); ctx.arc(56 + i*40, gy+15, 3.5, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(68 + i*40, gy+15, 3.5, 0, 7); ctx.fill();
    ctx.globalAlpha = 1;
  }

  // 螺旋星系（右侧小漩涡，海报背景同款）
  ctx.save(); ctx.translate(646, 166); ctx.rotate(t/9000);
  for (let i=0;i<3;i++){
    ctx.globalAlpha = .22 - i*.05;
    ctx.strokeStyle = '#b48cff'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 0, 15 + i*13, .5, 4.9 - i*.7); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  tGlow(0, 0, 14, 'rgba(220,200,255,.8)');
  ctx.restore();

  // 哨兵在右平台巡逻
  const sweep = (Math.sin(t/2600)*.5+.5) * 200 + 580;
  tCube(sweep, PLATS[2].y + 23, 'guard', 40);

  // 金色压力板（中平台）+ 不断上升的金色光粒
  const press = .5 + .5*Math.sin(t/700);
  const plateX = 360, plateY = PLATS[1].y;
  ctx.globalAlpha = .3 + .4*press;
  tGlow(plateX, plateY + 14, 40, 'rgba(255,215,106,.8)');
  ctx.globalAlpha = 1;
  ctx.beginPath(); ctx.arc(plateX, plateY + 14, 12 + press*3, 0, 7);
  ctx.strokeStyle = `rgba(255,215,106,${.45+.5*press})`; ctx.lineWidth = 3.5; ctx.stroke();
  for (let i=0;i<7;i++){
    const k = ((t/28) + i*43) % 110;
    ctx.globalAlpha = Math.max(0, .5*(1 - k/110));
    ctx.fillStyle = '#ffd76a';
    ctx.beginPath(); ctx.arc(plateX + Math.sin((k+i*80)/40)*14, plateY + 8 - k, 2.2, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // 紫色霓虹传送门（右平台末端，海报右下角同款）
  const pu = .6 + .4*Math.sin(t/800);
  ctx.save(); ctx.shadowColor = '#b06cff'; ctx.shadowBlur = 14*pu;
  ctx.fillStyle = `rgba(160,100,220,${.12+.12*pu})`;
  rr(786, PLATS[2].y - 10, 48, 48, 12);
  ctx.strokeStyle = `rgba(196,140,255,${.5+.4*pu})`; ctx.lineWidth = 4;
  ctx.stroke();
  ctx.restore();

  // ===== 主角静立于中平台（海报中心的形象），轻微呼吸浮动 =====
  const breathe = Math.sin(t/1000)*2;
  tCube(PLATS[1].x + 100, PLATS[1].y + 23 + breathe, 'player', 46);

  // ===== 底部粉紫云海（海报前景，缓慢漂移） =====
  for (let i=0;i<12;i++){

    const cy = 490 + Math.sin(i*2.4)*8;
    ctx.fillStyle = i%2 ? 'rgba(196,120,220,.13)' : 'rgba(255,140,190,.11)';
    ctx.beginPath(); ctx.ellipse(cx, cy, 62, 26, 0, 0, 7); ctx.fill();
  }

  // 标题：行星环 + 时痕
  ctx.save(); ctx.translate(VIEW_W/2, VIEW_H*.19); ctx.rotate(-.12);
  ctx.strokeStyle = 'rgba(205,225,255,.7)'; ctx.lineWidth = 2.5;
  ctx.shadowColor = '#8fb0ff'; ctx.shadowBlur = 10;
  ctx.beginPath(); ctx.ellipse(0, 0, 215, 54, 0, 0, 7); ctx.stroke();
  const pa = t/1600;
  ctx.fillStyle = '#9fe0ff';
  ctx.beginPath(); ctx.arc(Math.cos(pa)*215, Math.sin(pa)*54, 5, 0, 7); ctx.fill();
  ctx.restore();
  ctx.font = 'bold 96px "Microsoft YaHei"';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#eef3ff';
  ctx.shadowColor = '#6ea8ff'; ctx.shadowBlur = 28;
  ctx.fillText('时 痕', VIEW_W/2, VIEW_H*.19);
  ctx.shadowBlur = 0;
  ctx.font = '16px "Microsoft YaHei"'; ctx.fillStyle = '#9fb0e0';
  ctx.fillText('—— 每一次重来，都留下一道痕 ——', VIEW_W/2, VIEW_H*.19 + 76);
}

function draw(){
  // 清屏用物理像素；游戏内容经视口变换缩放到全屏居中
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.setTransform(dpr*viewScale,0,0,dpr*viewScale,dpr*viewOx,dpr*viewOy);

  // 标题页：代码重建的海报动态场景
  if (mode === 'title'){
    ctx.setTransform(1,0,0,1,0,0);
    ctx.fillStyle = '#141232'; // 黑边与星云中段同色，视觉上无缝
    ctx.fillRect(0,0,cv.width,cv.height);
    ctx.setTransform(dpr*viewScale,0,0,dpr*viewScale,dpr*viewOx,dpr*viewOy);
    titleScene(globalT);
    return;
  }

  // 星空背景 + 底部淡云海（海报氛围的暗化版）
  drawSky(globalT, true);
  for (let i=0;i<12;i++){
    const cx = ((i*167 + globalT/46) % (VIEW_W+140)) - 70;
    const cy = VIEW_H - 6 + Math.sin(i*2.4)*6;
    ctx.fillStyle = i%2 ? 'rgba(196,120,220,.07)' : 'rgba(255,140,190,.06)';
    ctx.beginPath(); ctx.ellipse(cx, cy, 62, 22, 0, 0, 7); ctx.fill();
  }

  if (!G) return;
  const { ox, oy } = G, L = G.L;

  // 石板平台：台阶素材按水平段整条贴图（顶面对齐碰撞格顶；竖向墙堆叠仍用方块）
  if (stepCanvas){
    const ratio = stepCanvas.height/stepCanvas.width;
    for (const s of L.segs){
      if (s.y===0) continue; // 顶墙不画
      let x0=s.x0, x1=s.x1;
      if (s.y!==L.rows-1){ x0=Math.max(x0,1); x1=Math.min(x1,L.cols-2); if (x0>x1) continue; }
      const w=(x1-x0+1)*CELL, sxp=ox+x0*CELL, syp=oy+s.y*CELL;
      const wallUp = s.y>1 && L.walls.has(x0+','+(s.y-1));
      const wallDn = s.y+1<L.rows-1 && L.walls.has(x0+','+(s.y+1));
      if (w===CELL && (wallUp || wallDn)){
        tBrick(sxp+2, syp+2, CELL-4, CELL-4); // 竖墙列：上下（除底行地面）有墙，用方块
        continue;
      }
      if (s.y===L.rows-1){
        // 底行地面：整条「底部平台」长图完整显示一遍（按地面宽度铺满）
        const gSrc = platCanvas || groundCanvas;
        if (gSrc){
          ctx.drawImage(gSrc, ox+x0*CELL, syp, w, CELL);
        } else {
          const tw = stepCanvas ? stepCanvas.width/8 : 0;
          if (tw) for (let gx=x0; gx<=x1; gx++){
            const ph = 1 + ((gx-x0) % 6); // 用中间6段循环，避开首尾端头
            ctx.drawImage(stepCanvas, ph*tw, 0, tw, stepCanvas.height, ox+gx*CELL, syp, CELL, CELL);
          }
        }
        continue;
      }
      const h=Math.max(18, Math.min(CELL, w*ratio));
      ctx.drawImage(stepCanvas, sxp, syp, w, h);
    }
  }

  // 地图格子
  for (let y=0;y<L.rows;y++) for (let x=0;x<L.cols;x++){
    const px = ox + x*CELL, py = oy + y*CELL, ch = L.map[y][x];
    if (ch==='#'){
      if (stepCanvas) continue; // 石板已按段绘制
      // 外框墙不绘制：顶部与两侧开放（星空直接露出），仅保留底部地面
      if ((y===0 || x===0 || x===L.cols-1) && y!==L.rows-1) continue;
      tBrick(px+2, py+2, CELL-4, CELL-4); // 海报同款高光砖
    }
    else if (ch==='^'){
      ctx.fillStyle = '#ff5470';
      for (let k=0;k<3;k++){
        ctx.beginPath();
        ctx.moveTo(px+8+k*15, py+CELL);
        ctx.lineTo(px+15.5+k*15, py+16);
        ctx.lineTo(px+23+k*15, py+CELL);
        ctx.closePath(); ctx.fill();
      }
    }
    else if (ch==='E'){
      const pulse = 0.5 + 0.5*Math.sin(globalT/300);
      ctx.save(); ctx.shadowColor = '#b06cff'; ctx.shadowBlur = 16*pulse;
      ctx.fillStyle = `rgba(160,100,220,${.16+.14*pulse})`;
      rr(px+6,py+6,CELL-12,CELL-12,12);
      ctx.strokeStyle = `rgba(196,140,255,${.5+.45*pulse})`; ctx.lineWidth = 3.5;
      ctx.stroke();
      ctx.restore();
    }
    else {
      ctx.fillStyle = (x+y)%2 ? '#121730' : '#101528';
      rr(px+1,py+1,CELL-2,CELL-2,6);
    }
  }

  // 压力板（圆形）/ 拉杆（toggle，方形，踩下永久触发）—— AABB 压住判定
  for (const p of L.plates){
    const px = ox + p.x*CELL, py = oy + p.y*CELL;
    if (p.toggle){
      const on = G.tripped.has(p.x+','+p.y) || entities().some(e=>onPlate(e, p.x, p.y));
      ctx.save();
      if (on){ ctx.shadowColor='#ffd76a'; ctx.shadowBlur=18; }
      rr(px+10, py+10, CELL-20, CELL-20, 8);
      ctx.fillStyle = on ? '#ffd76a' : '#3c4780'; ctx.fill();
      ctx.restore();
      ctx.fillStyle = on ? '#7a5b00' : '#223055';
      ctx.beginPath(); ctx.arc(px+CELL/2, py+CELL/2, 7, 0, 7); ctx.fill();
      continue;
    }
    const pressed = entities().some(e=>onPlate(e, p.x, p.y));
    if (pressed){
      ctx.save(); ctx.shadowColor='#ffd76a'; ctx.shadowBlur=20;
      ctx.fillStyle='#ffd76a';
      ctx.beginPath(); ctx.arc(px+CELL/2, py+CELL-19, 13, 0, 7); ctx.fill();
      ctx.restore();
    }
    ctx.beginPath(); ctx.arc(px+CELL/2, py+CELL/2, 18, 0, 7);
    ctx.strokeStyle = pressed ? '#ffd76a' : '#3c4780'; ctx.lineWidth = 4; ctx.stroke();
    if (pressed){
      ctx.save(); ctx.shadowColor='#ffd76a'; ctx.shadowBlur=18;
      ctx.beginPath(); ctx.arc(px+CELL/2, py+CELL/2, 12, 0, 7);
      ctx.fillStyle='#ffd76a'; ctx.fill(); ctx.restore();
    } else {
      ctx.beginPath(); ctx.arc(px+CELL/2, py+CELL/2, 8, 0, 7);
      ctx.fillStyle='#314067'; ctx.fill();
    }
  }

  // 门（开合动画）
  for (const d of L.doors){
    const open = doorOpen(d) ? 1 : 0;
    let a = G.doorsAnim.get(d) ?? 0;
    a += (open - a) * 0.2;
    G.doorsAnim.set(d, a);
    const px = ox + d.x*CELL, py = oy + d.y*CELL;
    const h = (1-a) * (CELL-10);
    if (h > 2){
      ctx.fillStyle = '#ff9f43'; rr(px+8, py+5, CELL-16, h, 6);
      ctx.fillStyle = '#c96f1e'; rr(px+14, py+11, CELL-28, Math.max(h-12,0), 4);
    }
    ctx.strokeStyle = `rgba(255,159,67,${0.25+0.45*a})`; ctx.setLineDash([6,6]);
    ctx.strokeRect(px+8, py+8, CELL-16, CELL-16); ctx.setLineDash([]);
  }

  // 定时闸门（紫色，按节拍开合，底部有相位进度条）
  for (const tg of (L.timedGates||[])){
    const open = gateOpen(tg);
    const cyc = tg.openFor + tg.closedFor;
    const off = (G.pstep + tg.phase) % cyc;
    let a = G.doorsAnim.get(tg) ?? (open?1:0);
    a += ((open?1:0) - a) * 0.25;
    G.doorsAnim.set(tg, a);
    const px = ox + tg.x*CELL, py = oy + tg.y*CELL;
    const h = (1-a) * (CELL-10);
    if (h > 2){
      ctx.save(); ctx.shadowColor='#b48cff'; ctx.shadowBlur=12;
      ctx.fillStyle = '#8f6fe0'; rr(px+8, py+5, CELL-16, h, 6);
      ctx.restore();
      ctx.fillStyle = '#5d3fa8'; rr(px+14, py+11, CELL-28, Math.max(h-12,0), 4);
    }
    // 剩余相位指示条
    const remain = open ? (tg.openFor-off)/tg.openFor : (cyc-off)/tg.closedFor;
    ctx.fillStyle = open ? 'rgba(180,140,255,.9)' : 'rgba(93,63,168,.7)';
    rr(px+8, py+CELL-9, (CELL-16)*Math.max(remain,0), 4, 2);
  }

  // 单向弹板（细圆角横板 + 上箭头）：可从下方穿过、从上方落入站立
  for (const ow of (L.oneways||[])){
    const px = ox + ow.x*CELL, py = oy + ow.y*CELL;
    ctx.save(); ctx.shadowColor='#4f8dff'; ctx.shadowBlur=8;
    ctx.fillStyle = '#3d8bff'; rr(px+2, py+2, CELL-4, 14, 7);
    ctx.restore();
    ctx.strokeStyle = 'rgba(159,196,255,.75)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(px+CELL/2, py+CELL-12); ctx.lineTo(px+CELL/2, py+30);
    ctx.moveTo(px+CELL/2-7, py+38); ctx.lineTo(px+CELL/2, py+30); ctx.lineTo(px+CELL/2+7, py+38);
    ctx.stroke();
  }

  // 哨兵（红色，缓慢巡逻，碰到即死；幽灵免疫）—— 渲染与判定同源，整步匀速滑行
  for (const gd of (L.guards||[])){
    const gp = guardRenderPos(gd);
    const px = ox + gp[0]*CELL, py = oy + gp[1]*CELL;
    ctx.save(); ctx.shadowColor='#ff5470'; ctx.shadowBlur=16;
    ctx.fillStyle = '#ff5470';
    rr(px+10, py+10, CELL-20, CELL-20, 10);
    ctx.restore();
    ctx.fillStyle = '#0b0e1a';
    ctx.beginPath(); ctx.arc(px+CELL/2, py+CELL/2-3, 5, 0, 7); ctx.fill();
    ctx.fillStyle = '#ffdde4';
    ctx.beginPath(); ctx.arc(px+CELL/2, py+CELL/2-3, 2, 0, 7); ctx.fill();
  }

  // 幽灵克隆体（拖尾 + 半透明，像素坐标）
  G.ghosts.forEach((g,i)=>{
    const hue = (i*70+190) % 360;
    let tr = trails.get(g); if (!tr){ tr = []; trails.set(g, tr); }
    tr.push({x:g.x, y:g.y}); if (tr.length > 12) tr.shift();
    tr.forEach((pt,idx)=>{
      ctx.globalAlpha = (idx/tr.length) * 0.16;
      ctx.fillStyle = `hsl(${hue},80%,65%)`;
      ctx.beginPath(); ctx.arc(ox+pt.x+EW/2, oy+pt.y+EH/2, 10, 0, 7); ctx.fill();
    });
    ctx.globalAlpha = 1; // 残影循环后必须复位，否则后续玩家绘制会被半透明化
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = `hsl(${hue},80%,62%)`;
    rr(ox+g.x, oy+g.y, EW, EH, 10);
    drawEyes(ox+g.x, oy+g.y, g.face);
    ctx.globalAlpha = 1;
  });

  // 玩家（像素坐标）
  if (G.player.alive){
    const p = G.player;
    ctx.save(); ctx.shadowColor='#8fb0ff'; ctx.shadowBlur=20;
    ctx.fillStyle = '#f2f6ff';
    rr(ox+p.x, oy+p.y, EW, EH, 10);
    ctx.restore();
    drawEyes(ox+p.x, oy+p.y, p.face);
  } else {
    if (Math.floor(globalT/80)%2===0){
      const p = G.player;
      ctx.fillStyle = '#ff5470'; ctx.font='30px serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('💥', ox+p.x+EW/2, oy+p.y+EH/2);
    }
  }

  // 过关提示
  if (mode==='clear'){
    ctx.fillStyle = 'rgba(126,224,163,.10)'; ctx.fillRect(0,0,VIEW_W,VIEW_H);
    ctx.fillStyle = '#7ee0a3'; ctx.font='bold 34px "Microsoft YaHei"';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('✔ 时间线闭合', VIEW_W/2, VIEW_H/2 - 16);
    ctx.font='15px "Microsoft YaHei"'; ctx.fillStyle='#a8d8bd';
    ctx.fillText('本条时间线的你，正在出口等待下一次循环……', VIEW_W/2, VIEW_H/2 + 26);
  }
}

function drawEyes(px, py, face){
  ctx.fillStyle = '#0b0e1a';
  const cx = px + EW/2 + (face==='left' ? -3 : 0);
  const cy = py + EH/2 - 4;
  ctx.beginPath(); ctx.arc(cx-8, cy, 4, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(cx+8, cy, 4, 0, 7); ctx.fill();
}

requestAnimationFrame(frame);

/* 只读调试探针 + 隐藏跳关钩子（自动化测试 / 后续迭代用） */
window.__tc = () => ({
  mode,
  level: G?.L?.name,
  ghosts: G?.ghosts.length,
  pstep: G?.pstep,
  player: G ? { x: G.player.x, y: G.player.y, grounded: G.player.grounded, alive: G.player.alive } : null,
  ghostsPos: G?.ghosts.map(g => [g.x, g.y]),
  inputsLen: G?.inputs?.length,
  guards: G?.L?.guards?.map(gd => guardPos(gd)),
  gates: G?.L?.timedGates?.map(tg => gateOpen(tg)),
  doorsOpen: G?.L?.doors?.map(d => doorOpen(d))
});
window.__goto = (i) => { loadLevel(i); mode = 'play'; overlayEl.classList.add('hidden'); };

/* F 键切换浏览器全屏 */
addEventListener('keydown', e => {
  if (e.code === 'KeyF' && !e.repeat){
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(()=>{});
  }
});

/* ---------- 海报主页：上升光尘粒子 + 鼠标视差 ---------- */
(function(){
  const dust = document.getElementById('dust');
  const poster = document.getElementById('poster');
  if (!dust || !poster) return;
  for (let i = 0; i < 30; i++){
    const p = document.createElement('i');
    const size = (2 + Math.random() * 4).toFixed(1);
    p.style.left = (Math.random() * 100).toFixed(1) + '%';
    p.style.width = p.style.height = size + 'px';
    p.style.animationDuration = (9 + Math.random() * 14).toFixed(1) + 's';
    p.style.animationDelay = (-Math.random() * 20).toFixed(1) + 's';
    dust.appendChild(p);
  }
  // 海报的 transform 被 kenburns 动画占用，视差用独立 translate 属性叠加
  addEventListener('mousemove', e => {
    if (!overlayEl.classList.contains('title-mode')) return;
    const dx = (e.clientX / innerWidth - .5) * 14;
    const dy = (e.clientY / innerHeight - .5) * 10;
    poster.style.translate = dx.toFixed(1) + 'px ' + dy.toFixed(1) + 'px';
  });
})();
</script>
